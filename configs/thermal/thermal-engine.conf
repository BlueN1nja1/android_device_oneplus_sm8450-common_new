# AOSP Thermal Configuration for SM8450 (OnePlus 10 Pro)

[GOLD_CPU_MONITOR]
algo_type monitor
sensor xo-therm
sampling 1000
thresholds 45000 50000 55000
thresholds_clr 43000 48000 52000
actions cpu-cluster1 cpu-cluster1 cpu-cluster1
action_info 1804800 1305600 902400

[PRIME_CPU_MONITOR]
algo_type monitor
sensor xo-therm
sampling 1000
thresholds 45000 50000 55000
thresholds_clr 43000 48000 52000
actions cpu-cluster2 cpu-cluster2 cpu-cluster2
action_info 1804800 1305600 902400

[GPU_MONITOR]
algo_type monitor
sensor xo-therm
sampling 1000
thresholds 47000 52000
thresholds_clr 44000 49000
actions gpu gpu
action_info 400000000 300000000
